name: tailscale
services:
  tailscale:
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
      - SYS_ADMIN
    cpu_shares: 50
    container_name: tailscale
    # network_mode: container:network-holder
    hostname: tailscale
    networks:
      - nginxproxymanager
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: "134217728"
    environment:
      # - TS_ACCEPT_DNS=true
      - TS_AUTHKEY=
      - TS_EXTRA_ARGS=--accept-dns=true --advertise-exit-node=true --ssh --accept-routes --advertise-tags=${TS_TAGS}
      - TS_HOSTNAME=${TS_HOSTNAME}
      # - TS_ROUTES=
      - TS_SERVE_CONFIG=/usr/tailscale/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKS5_SERVER=:1055
      # - TS_OUTBOUND_HTTP_PROXY_LISTEN=:1055
    image: tailscale/tailscale:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Tailscale/icon.png
    privileged: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/tailscale
        target: /var/lib/tailscale
      - type: bind
        source: /dev/net/tun
        target: /dev/net/tun
      - type: bind
        source: ${PIFIVE_TAILSCALE_SERVE_CONFIG_HOST_PATH}
        target: /usr/tailscale/config

  temporal-tcp-proxy:
    image: alpine/socat
    container_name: temporal-tcp-proxy
    mem_limit: 64m
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - .env
    restart: on-failure
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        if [ "${TEMPORAL_TCP_PROXY_ENABLED:-false}" = "true" ]; then
          echo "Starting Temporal TCP Proxy..."
          exec socat TCP4-LISTEN:7233,fork,reuseaddr "TCP4:${TEMPORAL_SERVER_DOMAIN}:${TEMPORAL_SERVER_PORT}"
        else
          echo "Temporal TCP Proxy disabled. Exiting..."
          exit 0
        fi

  tailscale-services-advertiser:
    depends_on:
      - tailscale
    image: docker:cli
    restart: on-failure
    command:
      - /bin/sh
      - -c
      - |
        if [ "${TAILSCALE_SERVICES_ADVERTISER_ENABLED:-false}" = "true" ]; then
          # Install jq
          apk add --no-cache jq
          
          echo "Waiting for tailscale container to be ready..."
          until docker exec tailscale tailscale status > /dev/null 2>&1; do
            sleep 5
          done
          echo "Tailscale is ready."

          # Extract service names from serve config 
          RAW_SERVICES=$$(jq -r '[.Services | to_entries[] | .key | sub("^svc:"; "")] | join(",")' /serve.json)  
          echo "Extracted services: $$RAW_SERVICES"
          
          if [ -n "$$RAW_SERVICES" ]; then
            echo "Found services to advertise using RAW_SERVICES variable."
            # Remove single/double quotes and replace commas with spaces
            CLEAN_SERVICES=$$(echo "$$RAW_SERVICES" | tr -d "\047\042" | tr "," " ")
            
            for SERVICE in $$CLEAN_SERVICES; do
              if [ -z "$$SERVICE" ]; then continue; fi
              echo "Advertising service: $$SERVICE"
              docker exec tailscale tailscale serve advertise "svc:$$SERVICE" || echo "Failed to advertise $$SERVICE"
            done
          else
            echo "No RAW_SERVICES provided."
          fi
        else
          echo "Tailscale Services Advertiser disabled. Exiting..."
          exit 0
        fi
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PIFIVE_TAILSCALE_SERVE_CONFIG_HOST_PATH}/serve.json:/serve.json:ro
    env_file:
      - .env
    networks:
      - nginxproxymanager

networks:
  nginxproxymanager:
    name: nginxproxymanager
    external: true
