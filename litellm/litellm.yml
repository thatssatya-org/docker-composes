services:
  db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ~/apps/litellm/pgdata:/var/lib/postgresql/data
    networks:
      - nginxproxymanager
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samsepiol -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "1000:1000"
    volumes:
      - ~/apps/litellm/litellm_config.yaml:/app/config.yaml:ro
    tmpfs:
      - /app/logs:size=64M,mode=1777
    env_file:
      - .env
    # ports:
    #   - "4000:4000"
    mem_limit: 512m
    environment:
      - LITELLM_CONFIG_PATH=/app/config.yaml
    networks:
      - nginxproxymanager

networks:
  nginxproxymanager:
    external: true