name: Deploy litellm

on:
  push:
    branches:
      - main
    paths:
      - 'litellm/litellm.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-compose.yml
    with:
      ssh_user: ${{ vars.PIFIVE_TAILSCALE_USER }}
      ssh_host: ${{ vars.PIFIVE_TAILSCALE_HOST }}
      app_directory: litellm
      docker_compose_file: litellm.yml
    secrets:
      tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      env_file_contents: ${{ secrets.LITELLM_ENV }}
