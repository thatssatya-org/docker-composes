name: Deploy pc-tailscale

on:
  push:
    branches:
      - main
    paths:
      - 'tailscales/pifive-tailscale.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-compose.yml
    with:
      ssh_user: ${{ vars.IMMICH_ML_USER }}
      ssh_host: ${{ vars.IMMICH_ML_HOST }}
      app_directory: tailscales
      docker_compose_file: pifive-tailscale.yml
      post_deploy_script: |
        echo "Creating serve config file..."
        echo "$TAILSCALE_SERVE_CONFIG" > "$TAILSCALE_SERVE_CONFIG_HOST_PATH/serve.json"
    secrets:
      tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      env_file_contents: |
        TAILSCALE_SERVE_CONFIG_HOST_PATH='${{ vars.PIFIVE_TAILSCALE_SERVE_CONFIG_HOST_PATH }}'
        TAILSCALE_SERVE_CONFIG='${{ vars.PC_TAILSCALE_SERVE_CONFIG }}'
        TAILSCALE_SERVICES_ADVERTISER_ENABLED='true'
        TS_TAGS='tag:pc-container-gateway'
        TS_HOSTNAME='pc-tailscale'
