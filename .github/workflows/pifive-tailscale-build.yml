name: Deploy pifive-tailscale

on:
  push:
    branches:
      - main
    paths:
      - 'tailscales/pifive-tailscale.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-compose.yml
    with:
      ssh_user: ${{ vars.PIFIVE_TAILSCALE_USER }}
      ssh_host: ${{ vars.PIFIVE_TAILSCALE_HOST }}
      app_directory: tailscales
      docker_compose_file: pifive-tailscale.yml
      post_deploy_script: |
        echo "Creating serve config file..."
        echo $PIFIVE_TAILSCALE_SERVE_CONFIG
        echo "$PIFIVE_TAILSCALE_SERVE_CONFIG" > "$PIFIVE_TAILSCALE_SERVE_CONFIG_HOST_PATH/serve.json"
    secrets:
      tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      env_file_contents: |
        PIFIVE_TAILSCALE_SERVE_CONFIG_HOST_PATH='${{ vars.PIFIVE_TAILSCALE_SERVE_CONFIG_HOST_PATH }}'
        PIFIVE_TAILSCALE_SERVE_CONFIG='${{ vars.PIFIVE_TAILSCALE_SERVE_CONFIG }}'
        TEMPORAL_SERVER_DOMAIN='${{ vars.TEMPORAL_SERVER_DOMAIN }}'
        TEMPORAL_SERVER_PORT='${{ vars.TEMPORAL_SERVER_PORT }}'
