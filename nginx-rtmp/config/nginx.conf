worker_processes auto;
rtmp_auto_push on;
events {}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;

        application live {
            live on;

            # Record the raw feed
            record all;
            record_path /opt/data/recordings;
            record_unique on;

            # Saves files with a timestamp, e.g., action4_2026-02-23_14-30-00.flv
            record_suffix _%Y-%m-%d_%H-%M-%S.flv;

            # Optional: Disable audio if you only need video frames for AI analysis
            # to save bandwidth, though keeping it is better for archiving.
            # wait_video on;
            # drop_idle_publisher 10s;
        }
    }
}